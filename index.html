<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Revision Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="wrap">
    <header class="head">
      <p class="eyebrow">Past Paper Penguin · GCSE Maths</p>
      <h1>Revision Generator</h1>
      <p class="sub">Generate a random topic sheet, work through it, then generate the next one.</p>
    </header>

    <section class="current" id="current" data-empty="true">
      <p class="current__placeholder">Press generate to get your first topic.</p>
    </section>

    <div class="actions">
      <button class="btn btn--primary" id="generateBtn">Generate topic</button>
    </div>

    <p class="progress" id="progress">80 topics remaining</p>

    <section class="history">
      <p class="history__label">Completed / generated</p>
      <ol class="history__list" id="historyList"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
