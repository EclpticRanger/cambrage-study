<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision Raffle — GCSE Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="booth">
    <header class="booth__header">
      <p class="eyebrow">Past Paper Penguin</p>
      <h1>Revision Raffle</h1>
      <p class="sub">Pull a ticket. Whatever topic it names, that's what you revise next.</p>
    </header>

    <div class="counter" id="counter">80 tickets in the drum</div>

    <div class="stage">
      <div class="drum" id="drum" aria-hidden="true">
        <span class="drum__count" id="drumCount">80</span>
      </div>

      <div class="ticket-slot">
        <div class="ticket" id="ticket" data-empty="true">
          <p class="ticket__hint">No ticket drawn yet</p>
        </div>
      </div>
    </div>

    <button class="draw-btn" id="drawBtn">Draw a ticket</button>

    <div class="stub-rail" aria-label="Drawn tickets">
      <p class="stub-rail__label">Drawn so far</p>
      <ol class="stub-list" id="stubList"></ol>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
